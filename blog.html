<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Ecografías Bogotá</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        .blog-content-section {
            padding: 60px 0;
            max-width: 800px;
            margin: 0 auto;
        }
        .blog-cover {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .blog-meta {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .blog-title {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
        }
        .blog-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }
        .blog-body h1, .blog-body h2, .blog-body h3 {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .blog-body p {
            line-height: 1.8;
            margin-bottom: 20px;
            color: #444;
        }
        .blog-body ul, .blog-body ol {
            margin-bottom: 20px;
            padding-left: 20px;
        }
        .blog-body li {
            line-height: 1.8;
            color: #444;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Vue 3 ESM CDN via Import Map -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
    
    <!-- Blog App Module -->
    <script type="module" src="js/app-blog.js?v=7"></script>
</body>
</html>
